# ===== 构建设置 =====
markdown: kramdown
kramdown:
  input: GFM

# 让 Jekyll 渲染 _pages 目录下的页面
include:
  - _pages

collections:
  publications:
    output: true
    permalink: /publication/:path/

defaults:
  - scope:
      path: ""
      type: publications
    values:
      layout: single

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - .gitignore
  - LICENSE
